name: Build Windows EXE + Smoke Test

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Build EXE
        run: python -m PyInstaller digiEdu.spec --noconfirm --clean

      - name: Smoke test EXE (run + probe endpoints)
        id: smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $exePath   = Join-Path $PWD 'dist\DigitalEdu.exe'
          $outLog    = Join-Path $PWD 'exe-stdout.log'
          $errLog    = Join-Path $PWD 'exe-stderr.log'
          $resultTxt = Join-Path $PWD 'smoke-test-result.txt'
          $baseUrl   = 'http://127.0.0.1:5199'

          $lines = @()
          $lines += '====================================================='
          $lines += ' DigitalEdu Windows EXE - Smoke Test Result'
          $lines += (' Date       : ' + (Get-Date -Format 'yyyy-MM-dd HH:mm:ss'))
          $lines += (' Commit     : ' + $env:GITHUB_SHA)
          $lines += (' Runner OS  : ' + $env:RUNNER_OS)

          if (-not (Test-Path $exePath)) {
            $lines += ' EXE found  : NO - build did not produce dist\DigitalEdu.exe'
            $lines += ' RESULT     : FAIL'
            $lines | Set-Content $resultTxt
            Get-Content $resultTxt
            exit 1
          }

          $sizeMb = [math]::Round((Get-Item $exePath).Length / 1MB, 1)
          $lines += (' EXE found  : YES (' + $sizeMb + ' MB)')
          $lines += '-----------------------------------------------------'

          # Start the exe with output captured to log files
          $proc = Start-Process -FilePath $exePath `
            -WorkingDirectory $PWD `
            -PassThru -WindowStyle Hidden `
            -RedirectStandardOutput $outLog `
            -RedirectStandardError  $errLog

          # Wait for the server to come up (first run extracts the bundle)
          $up = $false
          $lastCode = '000'
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            try {
              $code = & curl.exe -s -o NUL -w '%{http_code}' --max-time 5 "$baseUrl/"
              $lastCode = $code
              if ($code -eq '200') { $up = $true; break }
              if ($proc.HasExited) { break }
            } catch {
              if ($proc.HasExited) { break }
            }
          }

          $pass = $true

          if ($proc.HasExited) {
            $lines += (' Server started : NO - process exited early (code ' + $proc.ExitCode + ')')
            $pass = $false
          } elseif (-not $up) {
            $lines += (" Server started : NO - no HTTP 200 on / (last status: $lastCode)")
            $pass = $false
          } else {
            $lines += ' Server started : YES (HTTP 200 on /)'
          }

          # Helper: probe a URL, return "status|body"
          function Probe($url) {
            $bodyFile = New-TemporaryFile
            $code = & curl.exe -s -o $bodyFile.FullName -w '%{http_code}' --max-time 15 $url
            $body = ''
            try { $body = Get-Content $bodyFile.FullName -Raw } catch {}
            Remove-Item $bodyFile.FullName -Force
            return @($code, $body)
          }

          $checks = @()

          # Check 1: landing page serves the SPA, not an error page
          $r = Probe "$baseUrl/"
          $bad = ($r[1] -match 'TemplateNotFound') -or ($r[1] -match 'Internal Server Error')
          $okFlag = ($r[0] -eq '200') -and (-not $bad)
          $checks += @{ Name = 'GET / (SPA index)'; Code = $r[0]; Ok = $okFlag }
          if (-not $okFlag) { $pass = $false }

          # Check 2: hashed JS bundle referenced by index.html is reachable
          $mainJs = $null
          if ($r[1] -match '/assets/([^"'']+\.(?:js|css))') { $mainJs = $Matches[1] }
          if ($mainJs) {
            $r2 = Probe "$baseUrl/assets/$mainJs"
            $okFlag = ($r2[0] -eq '200')
            $checks += @{ Name = "GET /assets/$mainJs"; Code = $r2[0]; Ok = $okFlag }
            if (-not $okFlag) { $pass = $false }
          } else {
            $checks += @{ Name = 'SPA bundle reference'; Code = 'n/a'; Ok = $false }
            $pass = $false
          }

          # Check 3: courses API responds
          $r3 = Probe "$baseUrl/courses/api/tree"
          $okFlag = ($r3[0] -eq '200')
          $checks += @{ Name = 'GET /courses/api/tree'; Code = $r3[0]; Ok = $okFlag }
          if (-not $okFlag) { $pass = $false }

          # Check 4: /app/ SPA route
          $r4 = Probe "$baseUrl/app/"
          $okFlag = ($r4[0] -eq '200')
          $checks += @{ Name = 'GET /app/'; Code = $r4[0]; Ok = $okFlag }
          if (-not $okFlag) { $pass = $false }

          foreach ($c in $checks) {
            $mark = if ($c.Ok) { 'PASS' } else { 'FAIL' }
            $lines += (' [{0}] {1}  ->  HTTP {2}' -f $mark, $c.Name, $c.Code)
          }

          $lines += '-----------------------------------------------------'
          $lines += (' RESULT     : ' + $(if ($pass) { 'PASS' } else { 'FAIL' }))
          $lines += ''
          $lines += '===== EXE stdout (exe-stdout.log) ====='
          if (Test-Path $outLog) { $lines += (Get-Content $outLog | Select-Object -First 100) }
          $lines += ''
          $lines += '===== EXE stderr (exe-stderr.log) ====='
          if ((Test-Path $errLog) -and (Get-Item $errLog).Length -gt 0) {
            $lines += (Get-Content $errLog | Select-Object -First 50)
          } else {
            $lines += '(empty)'
          }

          # Stop the server
          if (-not $proc.HasExited) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

          $lines | Set-Content $resultTxt -Encoding UTF8
          Get-Content $resultTxt | ForEach-Object { $_ }

          # Visible summary in the GitHub Actions run page
          $summary = @()
          $summary += '## EXE Smoke Test Result'
          $summary += ''
          $summary += ('**RESULT: ' + $(if ($pass) { 'PASS ✅' } else { 'FAIL ❌' }) + '**')
          $summary += ''
          $summary += '| Check | Status |'
          $summary += '|---|---|'
          foreach ($c in $checks) {
            $mark = if ($c.Ok) { 'PASS' } else { 'FAIL' }
            $summary += ('| ' + $c.Name + ' | ' + $mark + ' (HTTP ' + $c.Code + ') |')
          }
          $summary += ''
          $summary += 'Full log: artifact ``smoke-test-result`` (smoke-test-result.txt)'
          $summary | Add-Content $env:GITHUB_STEP_SUMMARY

          if (-not $pass) { exit 1 }

      - name: Upload smoke test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-result
          path: |
            smoke-test-result.txt
            exe-stdout.log
            exe-stderr.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Visual check (open app in browser + screenshot)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $exePath = Join-Path $PWD 'dist\DigitalEdu.exe'
          $shot    = Join-Path $PWD 'exe-screenshot.png'
          $baseUrl = 'http://127.0.0.1:5199'

          # Kill any browser left over from the smoke test so the capture is clean
          Get-Process msedge, chrome -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          # Start the app fresh
          $proc = Start-Process -FilePath $exePath `
            -WorkingDirectory $PWD `
            -PassThru -WindowStyle Hidden

          # Wait for the server
          $up = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            try {
              $code = & curl.exe -s -o NUL -w '%{http_code}' --max-time 5 "$baseUrl/"
              if ($code -eq '200') { $up = $true; break }
            } catch {}
          }
          Write-Output "Server up: $up"

          if ($up) {
            # Open the app in Edge, maximized, no first-run dialogs
            $edge = "$env:ProgramFiles (x86)\Microsoft\Edge\Application\msedge.exe"
            if (-not (Test-Path $edge)) { $edge = "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe" }
            Write-Output "Using browser: $edge"
            Start-Process $edge -ArgumentList @(
              '--new-window', '--start-maximized', '--no-first-run',
              '--disable-features=msSmartScreenOverlay',
              '--window-size=1600,900',
              "$baseUrl/"
            )

            # Give the React SPA time to boot and fetch course data
            Start-Sleep -Seconds 25
          }

          # Capture the full screen
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $vs  = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $vs.Width, $vs.Height
          $g   = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($vs.X, $vs.Y, 0, 0, $bmp.Size)
          $bmp.Save($shot, [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose(); $bmp.Dispose()

          $kb = [math]::Round((Get-Item $shot).Length / 1KB)
          Write-Output "Screenshot saved: exe-screenshot.png ($kb KB)"
          if ($kb -lt 10) { Write-Output 'WARNING: screenshot suspiciously small - display may be blank' }

          # Stop the app and the browser
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
          Get-Process msedge, chrome -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exe-screenshot
          path: exe-screenshot.png
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DigitalEdu.exe
          generate_release_notes: true

      - name: Upload EXE as artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: DigitalEdu-windows
          path: dist/DigitalEdu.exe
          retention-days: 7

  build-windows7-exe:
    name: Build Windows 7 EXE (legacy, Python 3.8)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.8 (last version supporting Windows 7)
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies (Win7 compatible pins)
        run: |
          python -m pip install --upgrade pip
          pip install "pyinstaller==5.13.2"
          pip install -r requirements-windows-py38.txt

      - name: Build EXE
        run: python -m PyInstaller digiEdu-win7.spec --noconfirm --clean

      - name: Smoke test EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $proc = Start-Process -FilePath (Join-Path $PWD 'dist\DigitalEdu-Win7.exe') `
            -WorkingDirectory $PWD -PassThru -WindowStyle Hidden

          $up = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            try {
              $code = & curl.exe -s -o "$env:TEMP\page.html" -w '%{http_code}' --max-time 5 'http://127.0.0.1:5199/'
              if ($code -eq '200') { $up = $true; break }
              if ($proc.HasExited) { break }
            } catch {}
          }

          $body = ''
          if (Test-Path "$env:TEMP\page.html") { $body = Get-Content "$env:TEMP\page.html" -Raw }
          $bad = ($body -match 'TemplateNotFound') -or ($body -match 'Internal Server Error')

          Write-Output "Win7 exe server up : $up"
          Write-Output "Landing page clean : $(-not $bad)"
          if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }

          if (-not $up -or $bad) {
            Write-Output 'RESULT: FAIL'
            exit 1
          }
          Write-Output 'RESULT: PASS'

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DigitalEdu-Win7.exe

      - name: Upload EXE as artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: DigitalEdu-Windows7
          path: dist/DigitalEdu-Win7.exe
          retention-days: 7

  build-linux-deb:
    name: Build Debian (.deb) for Linux
    runs-on: ubuntu-latest
    container:
      image: debian:12
    timeout-minutes: 30
    steps:
      - name: Install toolchain
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git python3 python3-venv python3-pip curl binutils > /dev/null

      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --upgrade pip -q
          /tmp/venv/bin/pip install pyinstaller -q
          /tmp/venv/bin/pip install -r requirements.txt -q

      - name: Build Linux binary
        run: /tmp/venv/bin/pyinstaller digiEdu.spec --noconfirm --clean

      - name: Smoke test binary
        run: |
          ./dist/DigitalEdu > exe-stdout.log 2>&1 &
          APP_PID=$!
          up=0
          for i in $(seq 1 60); do
            sleep 2
            code=$(curl -s -o page.html -w '%{http_code}' --max-time 5 http://127.0.0.1:5199/ || true)
            if [ "$code" = "200" ]; then up=1; break; fi
            kill -0 $APP_PID 2>/dev/null || break
          done
          echo "Server up: $up"
          if [ "$up" != "1" ] || grep -qE 'TemplateNotFound|Internal Server Error' page.html; then
            echo 'RESULT: FAIL'
            tail -50 exe-stdout.log
            kill $APP_PID 2>/dev/null || true
            exit 1
          fi
          echo 'RESULT: PASS'
          kill $APP_PID 2>/dev/null || true

      - name: Package .deb
        id: deb
        run: |
          if [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          PKG=pkg/DEBIAN
          mkdir -p "$PKG" pkg/opt/DigitalEdu pkg/usr/bin pkg/usr/share/applications

          cp dist/DigitalEdu pkg/opt/DigitalEdu/DigitalEdu
          chmod 755 pkg/opt/DigitalEdu/DigitalEdu

          printf '%s\n' \
            '#!/bin/sh' \
            'exec /opt/DigitalEdu/DigitalEdu "$@"' \
            > pkg/usr/bin/digitaledu
          chmod 755 pkg/usr/bin/digitaledu

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=DigitalEdu' \
            'Comment=Offline competency-based learning platform (runs on http://127.0.0.1:5199)' \
            'Exec=/opt/DigitalEdu/DigitalEdu' \
            'Terminal=false' \
            'Categories=Education;' \
            > pkg/usr/share/applications/digitaledu.desktop

          { printf '%s\n' \
              'Package: digitaledu' \
              "Version: $VERSION" \
              'Section: education' \
              'Priority: optional' \
              'Architecture: amd64' \
              'Maintainer: Tadiyos Aschalew <nexuss0781@gmail.com>' \
              'Description: DigitalEdu offline learning platform' \
              ' Self-contained Flask + React learning platform served locally on port 5199.'
          } > "$PKG/control"

          dpkg-deb --build --root-owner-group pkg "digitaledu_${VERSION}_amd64.deb"
          dpkg-deb --info "digitaledu_${VERSION}_amd64.deb"

      - name: Verify .deb installs and launches
        run: |
          dpkg -i digitaledu_*_amd64.deb > /dev/null
          /usr/bin/digitaledu > wrapper-stdout.log 2>&1 &
          WRAP_PID=$!
          up=0
          for i in $(seq 1 60); do
            sleep 2
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:5199/ || true)
            if [ "$code" = "200" ]; then up=1; break; fi
            kill -0 $WRAP_PID 2>/dev/null || break
          done
          echo "Installed app via wrapper, server up: $up"
          kill $WRAP_PID 2>/dev/null || true
          if [ "$up" != "1" ]; then
            tail -30 wrapper-stdout.log
            exit 1
          fi

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: digitaledu_*_amd64.deb

      - name: Upload artifacts
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: DigitalEdu-linux-deb
          path: |
            digitaledu_*_amd64.deb
            dist/DigitalEdu
          retention-days: 7
